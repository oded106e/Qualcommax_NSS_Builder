name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'devices/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  schedule:
    - cron: "0 */2 * * *"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_REPO: JuliusBairaktaris/openwrt-nss-edma
  UPSTREAM_REF: nss-edma-rework
  NSS_REPO: JuliusBairaktaris/nss-packages
  NSS_REF: edma-nss
  TARGET: qualcommax/ipq807x
  VARIANT: edma-nss
  RELEASE_PREFIX: edma-nss
  MESH_RELEASE_PREFIX: edma-nss-mesh
  KEEP: "2"
  FEEDS: "src-git nss https://github.com/JuliusBairaktaris/nss-packages.git;edma-nss"

jobs:
  check:
    name: Check upstream
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
    outputs:
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
      nss_sha: ${{ steps.check.outputs.nss_sha }}
      need: ${{ steps.check.outputs.need }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: bash scripts/check-updates.sh

  release:
    name: Create draft release
    needs: check
    if: needs.check.outputs.need == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_SHA: ${{ needs.check.outputs.upstream_sha }}
      NSS_SHA: ${{ needs.check.outputs.nss_sha }}
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
      mesh_tag: ${{ steps.draft.outputs.mesh_tag }}
    steps:
      - id: draft
        run: |
          set -euo pipefail
          date=$(date -u +%F)
          stamp=$(date -u +%Y%m%dT%H%M%SZ)

          draft() {
            local prefix="$1" name="$2" tag
            tag="${prefix}-${stamp}-${GITHUB_RUN_ID}"

            {
              echo "## OpenWrt Build — ${name}"
              echo "- **Date**: $date"
              echo "- **Variant**: \`${name}\`"
              echo "- **Target**: \`${TARGET}\`"
              echo "- **Upstream**: \`${UPSTREAM_REPO}@${UPSTREAM_SHA}\`"
              if [[ -n "${NSS_SHA}" ]]; then
                echo "- **NSS**: \`${NSS_SHA}\`"
              fi
              echo "- **Trigger**: \`${GITHUB_EVENT_NAME}\`"
              echo
              if [[ "$prefix" == "$MESH_RELEASE_PREFIX" ]]; then
                echo "**802.11s mesh offload build.**"
                echo
              fi
              echo "Pick the sysupgrade image and flash over OpenWrt."
            } >release_notes.md

            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "OpenWrt ${name} $date" \
              --notes-file release_notes.md >&2

            printf '%s\n' "$tag"
          }

          {
            echo "tag=$(draft "$RELEASE_PREFIX" "$VARIANT")"
            echo "mesh_tag=$(draft "$MESH_RELEASE_PREFIX" "$MESH_RELEASE_PREFIX")"
          } >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.device }} (${{ matrix.flavour }})
    needs: [check, release]
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        device:
          - xiaomi_ax3600
        flavour:
          - default
          - mesh
        include:
          - flavour: mesh
            config_fragment: devices/common/config.mesh
    env:
      GH_TOKEN: ${{ github.token }}
      DEVICE: ${{ matrix.device }}
      CONFIG_FRAGMENT: ${{ matrix.config_fragment }}
      TAG: ${{ matrix.flavour == 'mesh' && needs.release.outputs.mesh_tag || needs.release.outputs.tag }}
    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bzip2 g++ gawk gcc git glibc-source libncurses-dev make rsync

      - name: Checkout OpenWrt source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check.outputs.upstream_sha }}
          fetch-depth: 0
          path: openwrt

      - name: Checkout builder repo
        uses: actions/checkout@v7
        with:
          path: builder

      - name: Prepare build environment
        env:
          OPENWRT_DIR: ${{ github.workspace }}/openwrt
          BUILDER_REPO: ${{ github.workspace }}/builder
        run: bash builder/scripts/prepare-build.sh

      - name: Set executable permissions for scripts
        run: |
          SCRIPTS_TO_EXEC=(
            "openwrt/files/etc/uci-defaults/99-mwan3-delay"
            "openwrt/files/etc/ssh/disable_guests_wifi.sh"
            "openwrt/files/etc/ssh/login-notify.sh"
            "openwrt/files/etc/ssh/multicast-relay.py"
            "openwrt/files/etc/ssh/used-to-run-scripts.sh"
            "openwrt/files/etc/ssh/wakeuppc.sh"
          )
          for script in "${SCRIPTS_TO_EXEC[@]}"; do
            if [ -f "$script" ]; then
              echo "Setting 755 permissions for: $script"
              chmod 755 "$script"
            fi
          done

      - name: Set reproducible-build env
        working-directory: openwrt
        run: |
          set -euo pipefail
          {
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)"
            echo "TZ=UTC"
            echo "LC_ALL=C"
            echo "KBUILD_BUILD_USER=builder"
            echo "KBUILD_BUILD_HOST=github"
          } >>"$GITHUB_ENV"

      - name: Download sources
        working-directory: openwrt
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            make download -j"$(nproc)" V=s && break
            echo "Download attempt $attempt failed; retrying..."
            sleep 5
          done

      - name: Build
        working-directory: openwrt
        run: |
          set -euo pipefail
          if ! make -j"$(nproc)"; then
            echo "::warning::Parallel build failed; retrying single-threaded"
            make -j1 V=s
          fi

      - name: Upload images
        run: |
          set -euo pipefail
          out="openwrt/bin/targets/${TARGET}"

          mapfile -t assets < <(find "$out" -maxdepth 1 -type f -name 'openwrt-*-squashfs-sysupgrade.bin')
          [[ ${#assets[@]} -gt 0 ]] || { echo "::error::no sysupgrade images in $out"; exit 1; }
          grep 'sysupgrade.bin' "$out/sha256sums" >"sha256sums-${DEVICE}.txt"
          cp "$out/config.buildinfo" "config-${DEVICE}.buildinfo"

          for attempt in 1 2 3; do
            gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" --clobber \
              "${assets[@]}" "sha256sums-${DEVICE}.txt" "config-${DEVICE}.buildinfo" && break
            [[ $attempt -lt 3 ]] || { echo "::error::upload failed after $attempt attempts"; exit 1; }
            echo "::warning::upload attempt $attempt failed; retrying"
            sleep 15
          done

          {
            echo "## ${DEVICE}"
            echo "- assets: ${#assets[@]}"
          } >>"$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish release
    needs: [release, build]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
      MESH_TAG: ${{ needs.release.outputs.mesh_tag }}
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - name: Publish or discard
        run: |
          set -euo pipefail
          if [[ "$BUILD_RESULT" != "success" ]]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
            gh release delete "$MESH_TAG" --repo "$GITHUB_REPOSITORY" --yes
            echo "::error::a build group failed ($BUILD_RESULT); drafts discarded"
            exit 1
          fi
          gh release edit "$MESH_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  prune:
    name: Prune old releases
    needs: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Prune
        run: |
          set -euo pipefail
          PREFIX="$RELEASE_PREFIX" bash scripts/prune-releases.sh
          PREFIX="$MESH_RELEASE_PREFIX" bash scripts/prune-releases.sh
